<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="gameContainer">
        <h1>Tic Tac Toe</h1>
        <div id="cellContainer">
            <div cellIndex="0" class="cell" data-array="0"></div>
            <div cellIndex="1" class="cell" data-array="1"></div>
            <div cellIndex="2" class="cell" data-array="2"></div>
            <div cellIndex="3" class="cell" data-array="3"></div>
            <div cellIndex="4" class="cell" data-array="4"></div>
            <div cellIndex="5" class="cell" data-array="5"></div>
            <div cellIndex="6" class="cell" data-array="6"></div>
            <div cellIndex="7" class="cell" data-array="7"></div>
            <div cellIndex="8" class="cell" data-array="8"></div>
        </div>
        <h2 id="statusText"></h2>
        <button id="restartBtn">Restart</button>
    </div>
</body>
</html>
